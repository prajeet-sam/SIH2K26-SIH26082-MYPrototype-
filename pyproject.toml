[project]
name = "airacast-backend"
version = "0.1.0"
description = "AiraCast storage, ingestion and feature pipeline (Delhi NCR weather-coupled air quality forecasting)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
